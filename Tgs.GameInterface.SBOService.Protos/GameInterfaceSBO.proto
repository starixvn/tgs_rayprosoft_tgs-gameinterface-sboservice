syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.SBOService.Protos";

package GameInterfaceSBO;

// The greeting service definition.
service GameInterfaceSBO {
  // Sends a greeting
  rpc AgentPresetBetSettings(AgentPresetBetSettingsRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerKick (PlayerKickRequest) returns (BaseReply);
  rpc FundOut(FundRequest) returns (FundReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrlBySportsBook (GameUrlBySportsBookRequest) returns (GameUrlReply);
  rpc GameUrlByVirtualSports (GameUrlByVirtualSportsRequest) returns (GameUrlReply);
  rpc GameWagerBySportsBook (GameWagerRequest) returns (GameWagerReply);
  rpc GameWagerByVirtualSports  (GameWagerRequest) returns (GameWagerReply);
  rpc GameRecordBySeamlessGame  (GameRecordRequest) returns (GameRecordBySeamlessGameReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message AgentPresetBetSettingsRequest{
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string currency = 4;
	int32 min = 5;
	int32 max = 6;
	int32 max_per_match = 7;
	int32 casino_table_limit = 8;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string player_code= 4;
}

message PlayerCreateRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string player_code= 4;
}

message PlayerKickRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string player_code= 4;
}

message FundRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string player_code= 4;
	string order_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;
	string company_key = 2;
	string order_id = 3;
}

message GameUrlBySportsBookRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string player_code= 4;
	string lang = 5;
	bool is_mobile = 6;
}

message GameUrlByVirtualSportsRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string player_code= 4;
	string lang = 5;
}

message GameWagerRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	google.protobuf.Timestamp start_time = 4; 
	google.protobuf.Timestamp end_time = 5;
}

message GameRecordRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	google.protobuf.Timestamp start_time = 4; 
	google.protobuf.Timestamp end_time = 5;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	phoenix.protobuf.DecimalValue free_balance = 3;
	phoenix.protobuf.DecimalValue outstanding_balance = 4;
}

message FundReply {
	string txn_id = 1;
    string resp = 2;
}

message GameUrlReply {
	bool is_player_exist = 1;
	string game_url = 2;
}

message GameWagerReply {
	repeated GameWagerInfo items = 1;
}

message GameWagerInfo {
	string player_code = 1;
	string external_wager_id = 2;
    string external_game_id = 3;
	GameHistoryStatus status = 4;
	google.protobuf.Timestamp external_created_on = 5;
	google.protobuf.Timestamp external_closed_on = 6;
	phoenix.protobuf.DecimalValue bet = 7;
	phoenix.protobuf.DecimalValue valid_bet = 8;
	phoenix.protobuf.DecimalValue player_win_loss = 9;
	phoenix.protobuf.DecimalValue turnover = 10;
	phoenix.protobuf.DecimalValue settle = 11;
	string additional_data = 12;
}

message GameRecordBySeamlessGameReply {
	repeated GameRecordBySeamlessGameInfo items = 1;
}

message GameRecordBySeamlessGameInfo {
	string player_code = 1;
	string external_round_id = 2;
	string external_wager_id = 3;
    string external_game_id = 4;
	google.protobuf.Timestamp external_created_on = 5;
	google.protobuf.Timestamp external_closed_on = 6;
	GameHistoryStatus status = 7;
	phoenix.protobuf.DecimalValue bet = 8;
	phoenix.protobuf.DecimalValue settle = 9;
	phoenix.protobuf.DecimalValue win_loss = 10;
	phoenix.protobuf.DecimalValue turnover = 11;
	string additional_data = 12;
}

message CheckingServiceReply{
    string machine_name = 1;
}

enum GameHistoryStatus{
	GAME_HISTORY_STATUS_UNKNOWN = 0;
	GAME_HISTORY_STATUS_RUNNING = 1;
	GAME_HISTORY_STATUS_VOID = 2;
	GAME_HISTORY_STATUS_WON = 3;
	GAME_HISTORY_STATUS_LOSE = 4;
	GAME_HISTORY_STATUS_DRAW = 5;
}