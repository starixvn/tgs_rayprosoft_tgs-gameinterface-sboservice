syntax = "proto3";

import "phoenix/protobuf/decimal.proto";

option csharp_namespace = "Tgs.GameInterface.SBOService.Protos";

package gameinterfacesboservice;

// The greeting service definition.
service GameInterfaceSBOService {
  // Sends a greeting
  rpc AgentPresetBetSettings(AgentPresetBetSettingsRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerKick (PlayerKickRequest) returns (BaseReply);
  rpc FundOut(FundRequest) returns (FundReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (FundStatusReply);
  rpc GameUrlBySportsBook (GameUrlBySportsBookRequest) returns (GameUrlReply);
  rpc GameUrlByVirtualSports (GameUrlByVirtualSportsRequest) returns (GameUrlReply);
}

// The request message containing the user's name.
message AgentPresetBetSettingsRequest{
	string api_url = 1;
	string company_key = 2;
	string username = 3;
	string currency = 4;
	int32 min = 5;
	int32 max = 6;
	int32 max_per_match = 7;
	int32 casino_table_limit = 8;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string username= 4;
}

message PlayerCreateRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string username= 4;
}

message PlayerKickRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string username= 4;
}

message FundRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string username= 4;
	phoenix.protobuf.DecimalValue amount = 5;
}

message FundStatusRequest {
	string api_url = 1;
	string company_key = 2;
	string txn_id = 3;
}

message GameUrlBySportsBookRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string username= 4;
	string lang = 5;
	bool is_mobile = 6;
}

message GameUrlByVirtualSportsRequest {
	string api_url = 1;
	string company_key = 2;
	string agent = 3;
	string username= 4;
	string lang = 5;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string txn_id = 1;
    string refno = 2;
    phoenix.protobuf.DecimalValue balance = 3; 
}

message FundStatusReply {
	bool is_order_exist = 1;
}

message GameUrlReply {
	bool is_player_exist = 1;
	string game_url = 2;
}